<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Lemonade Match-3 🍹</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #0d1b2a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 680px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 3px solid #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow: hidden;
        }

        /* Заголовок */
        .brand-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fef08a;
            text-shadow: 0 0 12px rgba(254, 240, 138, 0.5);
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* Табло рахунку */
        .score-board {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #38bdf8;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .score-val {
            color: #f59e0b;
            font-size: 1.3rem;
        }

        /* Ігрове поле Match-3 */
        .grid-container {
            width: 360px;
            height: 360px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px;
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.3);
        }

        /* Баночки */
        .can-cell {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 3px 6px rgba(0,0,0,0.4);
        }

        .can-cell:hover {
            transform: scale(1.05);
        }

        .can-cell.selected {
            transform: scale(1.1);
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px #fef08a, inset 0 2px 4px rgba(255,255,255,0.5);
            z-index: 5;
        }

        /* Дизайн баночок за смаками */
        .can-currant { background: linear-gradient(180deg, #fbcfe8 0%, #ec4899 100%); color: #831843; }
        .can-cola { background: linear-gradient(180deg, #334155 0%, #0f172a 100%); color: #f8fafc; border-color: #f59e0b; }
        .can-mango { background: linear-gradient(180deg, #fef08a 0%, #f59e0b 100%); color: #78350f; }
        .can-bergamot { background: linear-gradient(180deg, #a7f3d0 0%, #10b981 100%); color: #064e3b; }
        .can-rose { background: linear-gradient(180deg, #fecdd3 0%, #f43f5e 100%); color: #881337; }

        .can-icon {
            font-size: 1.2rem;
            line-height: 1;
            margin-bottom: 2px;
        }

        .can-text {
            font-size: 0.42rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1.1;
        }

        /* Підказка */
        .hint {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }

        /* Екран Перемоги */
        .win-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            z-index: 20;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .win-overlay h2 {
            font-size: 2.2rem;
            color: #fef08a;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
        }

        .win-overlay p {
            font-size: 1.05rem;
            color: #e2e8f0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .win-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.5);
            transition: transform 0.2s;
        }

        .win-btn:hover {
            transform: scale(1.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="brand-header">
            <div class="brand-title">LEMONADE MATCH</div>
            <div class="brand-subtitle">UNDERWOOD BREWERY</div>
        </div>

        <div class="score-board">
            Рахунок: <span class="score-val" id="score">0</span> / 100 🍹
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="hint">Міняй сусідні баночки місцями, щоб зібрати 3+ в ряд!</div>

        <!-- Екран перемоги -->
        <div class="win-overlay" id="winOverlay">
            <h2>ПЕРЕМОГА! 🎉🍹</h2>
            <p>Ти набрав 100 балів та ідеально зібрав лимонадний мікс! Час освіжитися справжнім набором:</p>
            <a href="https://underwood.beer/product/lymonadnyj-nabir/" target="_blank" class="win-btn">Лимонадний Набір 🛒</a>
        </div>
    </div>

    <script>
        const GRID_SIZE = 6;
        const TARGET_SCORE = 100;
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const winOverlay = document.getElementById('winOverlay');

        const TYPES = [
            { id: 0, class: 'can-currant', icon: '🫐', label: 'CURRANT' },
            { id: 1, class: 'can-cola', icon: '🍊', label: 'ORANGE COLA' },
            { id: 2, class: 'can-mango', icon: '🥭', label: 'MANGO' },
            { id: 3, class: 'can-bergamot', icon: '🌺', label: 'BERGAMOT' },
            { id: 4, class: 'can-rose', icon: '🌹', label: 'ROSE' }
        ];

        let board = [];
        let score = 0;
        let selectedCell = null;
        let isProcessing = false;

        // Ініціалізація дошки без початкових трійок
        function initBoard() {
            gridEl.innerHTML = '';
            board = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let type;
                    do {
                        type = Math.floor(Math.random() * TYPES.length);
                    } while (
                        (r >= 2 && board[r-1][c] === type && board[r-2][c] === type) ||
                        (c >= 2 && board[r][c-1] === type && board[r][c-2] === type)
                    );
                    board[r][c] = type;
                }
            }
            renderBoard();
        }

        // Відображення дошки
        function renderBoard() {
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const typeIdx = board[r][c];
                    const item = TYPES[typeIdx];

                    const cell = document.createElement('div');
                    cell.className = `can-cell ${item.class}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.innerHTML = `
                        <div class="can-icon">${item.icon}</div>
                        <div class="can-text">${item.label}</div>
                    `;

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    gridEl.appendChild(cell);
                }
            }
        }

        // Клік по комірці
        async function handleCellClick(r, c) {
            if (isProcessing || score >= TARGET_SCORE) return;

            if (!selectedCell) {
                selectedCell = { r, c };
                renderBoard();
            } else {
                const r1 = selectedCell.r;
                const c1 = selectedCell.c;
                const isAdjacent = (Math.abs(r1 - r) + Math.abs(c1 - c)) === 1;

                if (isAdjacent) {
                    isProcessing = true;
                    // Обмін
                    swap(r1, c1, r, c);
                    renderBoard();

                    const matches = checkMatches();
                    if (matches.length > 0) {
                        selectedCell = null;
                        await processMatches();
                    } else {
                        // Якщо немає збігів — повертаємо назад
                        setTimeout(() => {
                            swap(r1, c1, r, c);
                            selectedCell = null;
                            renderBoard();
                            isProcessing = false;
                        }, 250);
                    }
                } else {
                    selectedCell = { r, c };
                    renderBoard();
                }
            }
        }

        function swap(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
        }

        // Перевірка збігів (3 і більше в ряд)
        function checkMatches() {
            let matched = new Set();

            // Горизонтальні збіги
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 2; c++) {
                    let type = board[r][c];
                    if (type !== null && type === board[r][c+1] && type === board[r][c+2]) {
                        matched.add(`${r},${c}`);
                        matched.add(`${r},${c+1}`);
                        matched.add(`${r},${c+2}`);
                    }
                }
            }

            // Вертикальні збіги
            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE - 2; r++) {
                    let type = board[r][c];
                    if (type !== null && type === board[r+1][c] && type === board[r+2][c]) {
                        matched.add(`${r},${c}`);
                        matched.add(`${r+1},${c}`);
                        matched.add(`${r+2},${c}`);
                    }
                }
            }

            return Array.from(matched).map(key => {
                const [r, c] = key.split(',').map(Number);
                return { r, c };
            });
        }

        // Обробка видалення та падіння нових баночок
        async function processMatches() {
            let matches = checkMatches();

            while (matches.length > 0) {
                // Нарахування балів (10 балів за кожну баночку)
                score += matches.length * 10;
                scoreEl.innerText = score;

                if (score >= TARGET_SCORE) {
                    scoreEl.innerText = TARGET_SCORE;
                    winOverlay.style.display = 'flex';
                    break;
                }

                // Очищення збігів
                matches.forEach(({ r, c }) => {
                    board[r][c] = null;
                });
                renderBoard();
                await new Promise(res => setTimeout(res, 200));

                // Падіння баночок
                for (let c = 0; c < GRID_SIZE; c++) {
                    for (let r = GRID_SIZE - 1; r >= 0; r--) {
                        if (board[r][c] === null) {
                            for (let k = r - 1; k >= 0; k--) {
                                if (board[k][c] !== null) {
                                    board[r][c] = board[k][c];
                                    board[k][c] = null;
                                    break;
                                }
                            }
                        }
                    }
                }

                // Заповнення порожніх місць зверху
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (board[r][c] === null) {
                            board[r][c] = Math.floor(Math.random() * TYPES.length);
                        }
                    }
                }

                renderBoard();
                await new Promise(res => setTimeout(res, 250));

                matches = checkMatches();
            }

            isProcessing = false;
        }

        initBoard();
    </script>
</body>
</html>
