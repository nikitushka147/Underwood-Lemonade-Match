<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Lemonade Match-3 🍹</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: #0d1b2a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 680px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 3px solid #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow: hidden;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fef08a;
            text-shadow: 0 0 12px rgba(254, 240, 138, 0.5);
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .score-board {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #38bdf8;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .score-val {
            color: #f59e0b;
            font-size: 1.3rem;
        }

        /* Ігрове поле */
        .grid-container {
            width: 360px;
            height: 360px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px;
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            touch-action: none;
        }

        /* Баночки */
        .can-cell {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: transform 0.15s, opacity 0.2s;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 3px 6px rgba(0,0,0,0.4);
        }

        .can-cell:active {
            cursor: grabbing;
        }

        .can-cell.selected {
            transform: scale(1.1);
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px #fef08a;
            z-index: 5;
        }

        /* Смаки Underwood зі скріншотів */
        .can-yachcha { background: linear-gradient(180deg, #facc15 0%, #dc2626 100%); color: #ffffff; }
        .can-currant { background: linear-gradient(180deg, #fbcfe8 0%, #ec4899 100%); color: #831843; }
        .can-cola { background: linear-gradient(180deg, #475569 0%, #0f172a 100%); color: #f8fafc; border-color: #f59e0b; }
        .can-mango { background: linear-gradient(180deg, #fef08a 0%, #f59e0b 100%); color: #78350f; }
        .can-vibe { background: linear-gradient(180deg, #ffffff 0%, #e11d48 100%); color: #881337; }

        .can-icon {
            font-size: 1.1rem;
            line-height: 1;
            margin-bottom: 2px;
            pointer-events: none;
        }

        .can-text {
            font-size: 0.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            text-align: center;
            line-height: 1;
            pointer-events: none;
        }

        .hint {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }

        /* Екран перемоги */
        .win-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            z-index: 20;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .win-overlay h2 {
            font-size: 2.2rem;
            color: #fef08a;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(254, 240, 138, 0.5);
        }

        .win-overlay p {
            font-size: 1.05rem;
            color: #e2e8f0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .win-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.5);
            transition: transform 0.2s;
        }

        .win-btn:hover {
            transform: scale(1.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="brand-header">
            <div class="brand-title">LEMONADE MATCH</div>
            <div class="brand-subtitle">UNDERWOOD BREWERY</div>
        </div>

        <div class="score-board">
            Рахунок: <span class="score-val" id="score">0</span> / 100 🍹
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="hint">Свайпай курсором/пальцем або клікай на сусідні баночки!</div>

        <div class="win-overlay" id="winOverlay">
            <h2>ПЕРЕМОГА! 🎉🍹</h2>
            <p>Ти набрав 100 балів та ідеально зібрав лимонадний мікс! Час освіжитися справжнім набором:</p>
            <a href="https://underwood.beer/product/lymonadnyj-nabir/" target="_blank" class="win-btn">Лимонадний Набір 🛒</a>
        </div>
    </div>

    <script>
        const GRID_SIZE = 6;
        const TARGET_SCORE = 100;
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const winOverlay = document.getElementById('winOverlay');

        // Точний асортимент зі скріншотів
        const TYPES = [
            { id: 0, class: 'can-yachcha', icon: '🍒', label: 'ЯЧЧА' },
            { id: 1, class: 'can-currant', icon: '🫐', label: 'CURRANT' },
            { id: 2, class: 'can-cola', icon: '🍊', label: 'ORANGE COLA' },
            { id: 3, class: 'can-mango', icon: '🥭', label: 'MANGO' },
            { id: 4, class: 'can-vibe', icon: '🌺', label: '+VIBE' }
        ];

        let board = [];
        let score = 0;
        let selectedCell = null;
        let isProcessing = false;

        // Початкова ініціалізація дошки
        function initBoard() {
            board = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let type;
                    do {
                        type = Math.floor(Math.random() * TYPES.length);
                    } while (
                        (r >= 2 && board[r-1][c] === type && board[r-2][c] === type) ||
                        (c >= 2 && board[r][c-1] === type && board[r][c-2] === type)
                    );
                    board[r][c] = type;
                }
            }
            renderBoard();
        }

        function renderBoard() {
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const typeIdx = board[r][c];
                    const item = TYPES[typeIdx];

                    const cell = document.createElement('div');
                    cell.className = `can-cell ${item ? item.class : ''}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (item) {
                        cell.innerHTML = `
                            <div class="can-icon">${item.icon}</div>
                            <div class="can-text">${item.label}</div>
                        `;
                    }

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    // Обробники подій для мишки та тачу
                    addDragAndTouchListeners(cell, r, c);

                    gridEl.appendChild(cell);
                }
            }
        }

        // Обробка Drag, Touch-свайпів та Кліків
        let startX = 0, startY = 0;

        function addDragAndTouchListeners(cell, r, c) {
            // Клік
            cell.addEventListener('click', () => handleCellClick(r, c));

            // Мишка (Drag)
            cell.addEventListener('mousedown', (e) => {
                startX = e.clientX;
                startY = e.clientY;
            });

            cell.addEventListener('mouseup', (e) => {
                const diffX = e.clientX - startX;
                const diffY = e.clientY - startY;
                handleSwipe(r, c, diffX, diffY);
            });

            // Смартфон (Touch)
            cell.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            cell.addEventListener('touchend', (e) => {
                const diffX = e.changedTouches[0].clientX - startX;
                const diffY = e.changedTouches[0].clientY - startY;
                handleSwipe(r, c, diffX, diffY);
            }, { passive: true });
        }

        function handleSwipe(r, c, diffX, diffY) {
            const threshold = 20; // Мінімальна відстань для свайпу
            if (Math.abs(diffX) < threshold && Math.abs(diffY) < threshold) return;

            let targetR = r;
            let targetC = c;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                targetC = diffX > 0 ? c + 1 : c - 1;
            } else {
                targetR = diffY > 0 ? r + 1 : r - 1;
            }

            if (targetR >= 0 && targetR < GRID_SIZE && targetC >= 0 && targetC < GRID_SIZE) {
                trySwap(r, c, targetR, targetC);
            }
        }

        async function handleCellClick(r, c) {
            if (isProcessing || score >= TARGET_SCORE) return;

            if (!selectedCell) {
                selectedCell = { r, c };
                renderBoard();
            } else {
                const r1 = selectedCell.r;
                const c1 = selectedCell.c;
                const isAdjacent = (Math.abs(r1 - r) + Math.abs(c1 - c)) === 1;

                if (isAdjacent) {
                    await trySwap(r1, c1, r, c);
                } else {
                    selectedCell = { r, c };
                    renderBoard();
                }
            }
        }

        async function trySwap(r1, c1, r2, c2) {
            if (isProcessing || score >= TARGET_SCORE) return;
            isProcessing = true;

            swap(r1, c1, r2, c2);
            selectedCell = null;
            renderBoard();

            const matches = checkMatches();
            if (matches.length > 0) {
                await processMatches();
            } else {
                // Повертаємо назад якщо збігу немає
                await new Promise(res => setTimeout(res, 200));
                swap(r1, c1, r2, c2);
                renderBoard();
                isProcessing = false;
            }
        }

        function swap(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
        }

        // Пошук збігів 3+ в ряд
        function checkMatches() {
            let matched = new Set();

            // Горизонталь
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 2; c++) {
                    let type = board[r][c];
                    if (type !== null && type === board[r][c+1] && type === board[r][c+2]) {
                        matched.add(`${r},${c}`);
                        matched.add(`${r},${c+1}`);
                        matched.add(`${r},${c+2}`);
                    }
                }
            }

            // Вертикаль
            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE - 2; r++) {
                    let type = board[r][c];
                    if (type !== null && type === board[r+1][c] && type === board[r+2][c]) {
                        matched.add(`${r},${c}`);
                        matched.add(`${r+1},${c}`);
                        matched.add(`${r+2},${c}`);
                    }
                }
            }

            return Array.from(matched).map(key => {
                const [r, c] = key.split(',').map(Number);
                return { r, c };
            });
        }

        // Очищення та зсув елементів
        async function processMatches() {
            let matches = checkMatches();

            while (matches.length > 0) {
                score += matches.length * 5;
                if (score > TARGET_SCORE) score = TARGET_SCORE;
                scoreEl.innerText = score;

                if (score >= TARGET_SCORE) {
                    winOverlay.style.display = 'flex';
                    break;
                }

                // Видаляємо збіги
                matches.forEach(({ r, c }) => {
                    board[r][c] = null;
                });
                renderBoard();
                await new Promise(res => setTimeout(res, 180));

                // Зсув вниз
                for (let c = 0; c < GRID_SIZE; c++) {
                    for (let r = GRID_SIZE - 1; r >= 0; r--) {
                        if (board[r][c] === null) {
                            for (let k = r - 1; k >= 0; k--) {
                                if (board[k][c] !== null) {
                                    board[r][c] = board[k][c];
                                    board[k][c] = null;
                                    break;
                                }
                            }
                        }
                    }
                }

                // Генерація нових баночок зверху
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (board[r][c] === null) {
                            board[r][c] = Math.floor(Math.random() * TYPES.length);
                        }
                    }
                }

                renderBoard();
                await new Promise(res => setTimeout(res, 220));

                matches = checkMatches();
            }

            isProcessing = false;
        }

        initBoard();
    </script>
</body>
</html>
